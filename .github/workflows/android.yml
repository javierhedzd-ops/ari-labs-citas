name: Compilar APK

# Solo a mano (Actions → Compilar APK → Run workflow). Javi pidió compilar cuando todo esté listo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas (incluye 1000 usuarios simulados)
        run: ./gradlew --no-daemon :nucleo:test

      - name: Reporte de la simulación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulacion-1000
          path: |
            nucleo/build/reports/simulacion-1000.txt
            nucleo/build/reports/tests/

      - name: APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ari-labs-citas-debug
          path: app/build/outputs/apk/debug/*.apk
