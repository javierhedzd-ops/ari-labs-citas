name: Compilar APK

# Solo a mano (Actions → Compilar APK → Run workflow). Javi pidió compilar cuando todo esté listo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas (incluye 1000 usuarios simulados)
        run: ./gradlew --no-daemon :nucleo:test

      - name: Reporte de la simulación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulacion-1000
          path: |
            nucleo/build/reports/simulacion-1000.txt
            nucleo/build/reports/tests/

      - name: APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ari-labs-citas-debug
          path: app/build/outputs/apk/debug/*.apk

      # Versión final firmada (para vender). Necesita los secretos FIRMA_LLAVE y FIRMA_CLAVE.
      - name: APK final firmado
        env:
          FIRMA_LLAVE: ${{ secrets.FIRMA_LLAVE }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          if [ -z "$FIRMA_LLAVE" ] || [ -z "$FIRMA_CLAVE" ]; then
            echo "::warning::Faltan los secretos FIRMA_LLAVE y FIRMA_CLAVE: no se hace la versión final."
            exit 0
          fi
          echo "$FIRMA_LLAVE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/firma.p12"
          export FIRMA_ARCHIVO="$RUNNER_TEMP/firma.p12"
          ./gradlew --no-daemon :app:assembleRelease
          ver=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p final && cp app/build/outputs/apk/release/app-release.apk "final/mis-citas-$ver.apk"
          rm -f "$RUNNER_TEMP/firma.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: mis-citas-final
          path: final/*.apk
          if-no-files-found: ignore

      # Para leer los informes de fallo de la versión final (el código va revuelto por R8).
      - uses: actions/upload-artifact@v4
        with:
          name: mis-citas-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      # Revisión automática de Android (no detiene la compilación; el reporte queda para leerlo).
      - name: Lint
        if: always()
        run: ./gradlew --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
