name: Probar en emulador

# A mano: instala la app en un teléfono Android virtual, la recorre y guarda capturas.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recorrido con capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || touch fallo
            adb pull /sdcard/capturas capturas || true
            test ! -f fallo

      - name: Subir capturas a la rama "capturas"
        if: always()
        run: |
          [ -d capturas ] || exit 0
          mkdir -p /tmp/c && cp capturas/*.png /tmp/c/ 2>/dev/null || exit 0
          git config user.name "ari-labs-bot" && git config user.email "ari-labs-bot@users.noreply.github.com"
          git checkout --orphan capturas-tmp
          git rm -rfq . && rm -rf ./*
          cp /tmp/c/*.png .
          git add *.png && git commit -qm "Capturas del emulador (${GITHUB_SHA::7})"
          git push -f origin HEAD:capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-emulador
          path: |
            capturas/
            app/build/reports/androidTests/
